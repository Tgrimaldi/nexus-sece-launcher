name: Deploy NEXUS SECE Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build valid PWA icons
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/Tgrimaldi/darts-sublimation-studio/main/public-assets/sece/nexus-manteniment-icon-180.png' -o icon-source.png
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('icon-source.png').convert('RGBA')
          im.resize((180,180),Image.Resampling.LANCZOS).save('icon-180.png',optimize=True)
          im.resize((192,192),Image.Resampling.LANCZOS).save('icon-192.png',optimize=True)
          im.resize((512,512),Image.Resampling.LANCZOS).save('icon-512.png',optimize=True)
          im.resize((512,512),Image.Resampling.LANCZOS).save('icon-maskable-512.png',optimize=True)
          PY
          python - <<'PY'
          from PIL import Image
          for f,s in [('icon-180.png',(180,180)),('icon-192.png',(192,192)),('icon-512.png',(512,512)),('icon-maskable-512.png',(512,512))]:
              im=Image.open(f); assert im.size==s, (f,im.size,s)
          print('PWA icons OK')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4