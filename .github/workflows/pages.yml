name: Deploy NEXUS SECE Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 512 icons
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('icon-192.png').convert('RGBA')
          im.resize((512,512),Image.Resampling.LANCZOS).save('icon-512.png',optimize=True)
          im.resize((512,512),Image.Resampling.LANCZOS).save('icon-maskable-512.png',optimize=True)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4